name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: bash install/validate.sh --static

      - name: Validate Proxy Hub compose
        env:
          SERVER_EDGE_PROXY_IMAGE: metacubex/mihomo:v1.19.30
          SERVER_EDGE_PROXY_FEED_IMAGE: busybox:1.37.0
          SERVER_EDGE_PROXY_CONFIG: /tmp/server-edge-proxy-config.yaml
          SERVER_EDGE_PROXY_STATE: /tmp/server-edge-proxy-state
          SERVER_EDGE_PROXY_FEED_ROOT: /tmp/server-edge-proxy-feed
          SERVER_EDGE_PROXY_FEED_BIND_IP: 127.0.0.1
          SERVER_EDGE_PROXY_CONTROLLER_BIND_IP: 127.0.0.1
          SERVER_EDGE_PROXY_NODE_BIND_IP: 127.0.0.1
        run: |
          docker compose \
            -f proxy-hub/compose.yaml \
            -f proxy-hub/compose.egress.yaml \
            -f proxy-hub/compose.local-node.yaml \
            config >/dev/null

      - name: Validate Proxy Hub modes
        run: |
          image="$(jq -r '.components.mihomo.image' manifests/versions.json)"
          for mode in off local; do
            tmp="$(mktemp -d)"
            sudo install -d -m 755 -o root -g root "$tmp/config"
            sudo install -d -m 700 -o root -g root \
              "$tmp/secrets/proxy-hub/providers" \
              "$tmp/state/proxy-hub/feed" \
              "$tmp/runtime/proxy-hub"
            printf 'SERVER_EDGE_PROXY_EGRESS=%s\nSERVER_EDGE_PROXY_SUBSCRIPTION_BASE_URL=auto\n' "$mode" \
              | sudo tee "$tmp/config/proxy-hub.env" >/dev/null
            printf '%048d\n' 0 | sudo tee "$tmp/secrets/proxy-hub/controller-secret" >/dev/null
            printf '%048d\n' 1 | sudo tee "$tmp/secrets/proxy-hub/subscription-token" >/dev/null
            sudo chmod 600 "$tmp/secrets/proxy-hub/controller-secret" "$tmp/secrets/proxy-hub/subscription-token"
            sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/write-runtime-env.sh
            sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/render-config.sh
            sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/render-feed.sh
            sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/write-public-contract.sh
            sudo docker run --rm \
              -v "$tmp/runtime/proxy-hub/config.yaml:/etc/mihomo/config.yaml:ro" \
              -v "$tmp/state/proxy-hub:/var/lib/mihomo" \
              "$image" -t -d /var/lib/mihomo -f /etc/mihomo/config.yaml >/dev/null
            sudo test -s "$tmp/state/proxy-hub/feed/$(printf '%048d' 1)/mihomo.yaml"
            if [[ "$mode" == local ]]; then
              sudo grep -q '^  - name: local-node$' "$tmp/runtime/proxy-hub/config.yaml"
              sudo grep -q '^    proxy: LOCAL$' "$tmp/runtime/proxy-hub/config.yaml"
            else
              if sudo grep -q '^mixed-port:' "$tmp/runtime/proxy-hub/config.yaml"; then
                echo 'ERROR: off mode unexpectedly exposes unified egress' >&2
                exit 1
              fi
            fi
          done

      - name: Validate provider-required modes
        run: |
          for mode in provider hybrid; do
            tmp="$(mktemp -d)"
            sudo install -d -m 755 -o root -g root "$tmp/config"
            sudo install -d -m 700 -o root -g root "$tmp/secrets/proxy-hub/providers"
            printf 'SERVER_EDGE_PROXY_EGRESS=%s\nSERVER_EDGE_PROXY_SUBSCRIPTION_BASE_URL=https://sub.example.com\n' "$mode" \
              | sudo tee "$tmp/config/proxy-hub.env" >/dev/null
            printf '%s\n' 'https://example.com/subscription' \
              | sudo tee "$tmp/secrets/proxy-hub/providers/primary.url" >/dev/null
            sudo chmod 600 "$tmp/secrets/proxy-hub/providers/primary.url"
            sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/validate-inputs.sh
          done

      - name: Validate release script permissions
        run: |
          tmp="$(mktemp -d)"
          cp -a . "$tmp/release"
          find "$tmp/release" -type f -name '*.sh' -exec chmod 0644 {} +
          source "$tmp/release/install/lib/common.sh"
          ensure_release_script_modes "$tmp/release"
          if find "$tmp/release" -type f -name '*.sh' ! -perm -u+x | grep -q .; then
            echo 'ERROR: release contains non-executable shell scripts' >&2
            exit 1
          fi
