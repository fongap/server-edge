name: Proxy Hub Runtime Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker binding ownership
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          sudo install -d -m 700 -o root -g root "$tmp/runtime/proxy-hub"
          cat <<'EOF' | sudo tee "$tmp/runtime/proxy-hub/compose.env" >/dev/null
          SERVER_EDGE_PROXY_CONTROLLER_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_CONTROLLER_PORT=19090
          SERVER_EDGE_PROXY_FEED_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_FEED_PORT=18780
          SERVER_EDGE_PROXY_NODE_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_LOCAL_NODE_PORT=17891
          SERVER_EDGE_PROXY_LOCAL_NODE_ENABLED=false
          SERVER_EDGE_PROXY_EGRESS_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_EGRESS_PORT=17890
          SERVER_EDGE_PROXY_EGRESS_ENABLED=false
          EOF

          image="$(jq -r '.components.busybox.image' manifests/versions.json)"
          docker pull "$image" >/dev/null

          docker run -d --name preflight-external \
            -p 127.0.0.1:19090:8080 \
            "$image" httpd -f -p 8080 >/dev/null
          if sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/check-host-bindings.sh; then
            echo 'ERROR: external Docker binding was not rejected' >&2
            exit 1
          fi
          docker rm -f preflight-external >/dev/null

          docker run -d --name preflight-owned \
            --label com.docker.compose.project=server-edge-proxy-hub \
            -p 127.0.0.1:19090:8080 \
            "$image" httpd -f -p 8080 >/dev/null
          sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/check-host-bindings.sh
          docker rm -f preflight-owned >/dev/null

          sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/check-host-bindings.sh

      - name: Validate subscription token revocation
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          current="$(printf '1%.0s' {1..48})"
          stale="$(printf '2%.0s' {1..48})"
          sudo install -d -m 700 -o root -g root \
            "$tmp/runtime/proxy-hub" \
            "$tmp/secrets/proxy-hub/providers" \
            "$tmp/state/proxy-hub/feed/$stale" \
            "$tmp/state/proxy-hub/feed/keep-me"
          printf '%s\n' 'https://example.com/subscription' | sudo tee "$tmp/secrets/proxy-hub/providers/primary.url" >/dev/null
          cat <<EOF | sudo tee "$tmp/runtime/proxy-hub/compose.env" >/dev/null
          SERVER_EDGE_PROXY_FEED_TOKEN=$current
          SERVER_EDGE_PROXY_LOCAL_NODE_ENABLED=false
          SERVER_EDGE_PROXY_LOCAL_NODE_PUBLISH=false
          SERVER_EDGE_PROXY_NODE_HOST=127.0.0.1
          SERVER_EDGE_PROXY_LOCAL_NODE_PORT=17891
          SERVER_EDGE_PROXY_SUBSCRIPTION_ORIGIN=http://127.0.0.1:18780
          SERVER_EDGE_PROXY_PROVIDER_INTERVAL=21600
          SERVER_EDGE_PROXY_HEALTH_URL=https://cp.cloudflare.com
          SERVER_EDGE_PROXY_HEALTH_INTERVAL=600
          SERVER_EDGE_PROXY_PROBE_INTERVAL=300
          SERVER_EDGE_PROXY_HEALTH_TIMEOUT=5000
          SERVER_EDGE_PROXY_AUTO_TOLERANCE=100
          EOF

          sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/render-feed.sh
          sudo test -f "$tmp/state/proxy-hub/feed/$current/mihomo.yaml"
          sudo test ! -e "$tmp/state/proxy-hub/feed/$stale"
          sudo test -d "$tmp/state/proxy-hub/feed/keep-me"

      - name: Validate rendered Compose host publishing
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          runtime="$tmp/runtime/proxy-hub"
          state="$tmp/state/proxy-hub"
          feed="$state/feed"
          sudo install -d -m 700 -o root -g root "$runtime" "$state" "$feed"

          proxy_image="$(jq -r '.components.mihomo.image' manifests/versions.json)"
          feed_image="$(jq -r '.components.busybox.image' manifests/versions.json)"
          cat <<EOF | sudo tee "$runtime/compose.env" >/dev/null
          SERVER_EDGE_PROXY_IMAGE=$proxy_image
          SERVER_EDGE_PROXY_FEED_IMAGE=$feed_image
          SERVER_EDGE_PROXY_CONFIG=$runtime/config.yaml
          SERVER_EDGE_PROXY_STATE=$state
          SERVER_EDGE_PROXY_FEED_ROOT=$feed
          SERVER_EDGE_PROXY_FEED_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_CONTROLLER_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_NODE_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_EGRESS_BIND_IP=127.0.0.1
          SERVER_EDGE_PROXY_LOCAL_NODE_ENABLED=true
          SERVER_EDGE_PROXY_EGRESS_ENABLED=true
          SERVER_EDGE_PROXY_EGRESS_PORT=37890
          SERVER_EDGE_PROXY_LOCAL_NODE_PORT=37891
          SERVER_EDGE_PROXY_FEED_PORT=38780
          SERVER_EDGE_PROXY_CONTROLLER_PORT=39090
          EOF
          cat <<'YAML' | sudo tee "$runtime/config.yaml" >/dev/null
          mode: rule
          log-level: warning
          mixed-port: 37890
          external-controller: "0.0.0.0:39090"
          secret: test
          rules:
            - MATCH,DIRECT
          YAML
          printf '%s\n' 'Feed OK' | sudo tee "$feed/index.html" >/dev/null

          sudo SERVER_EDGE_ROOT="$tmp" bash proxy-hub/scripts/render-runtime-compose.sh
          sudo docker compose -f "$runtime/compose.yaml" config >/dev/null

          docker network create edge_egress_ai >/dev/null
          docker network create edge_egress_workers >/dev/null
          docker network create --internal edge_service_proxy_public >/dev/null
          cleanup() {
            sudo docker compose -f "$runtime/compose.yaml" down --remove-orphans >/dev/null 2>&1 || true
            docker network rm edge_egress_ai edge_egress_workers edge_service_proxy_public >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          sudo docker compose -f "$runtime/compose.yaml" up -d
          proxy_id="$(sudo docker compose -f "$runtime/compose.yaml" ps -q proxy)"
          feed_id="$(sudo docker compose -f "$runtime/compose.yaml" ps -q feed)"

          sudo docker inspect "$proxy_id" | jq -e '
            .[0].NetworkSettings.Ports["39090/tcp"][0] == {HostIp:"127.0.0.1",HostPort:"39090"} and
            .[0].NetworkSettings.Ports["37890/tcp"][0] == {HostIp:"127.0.0.1",HostPort:"37890"} and
            .[0].NetworkSettings.Ports["37890/udp"][0] == {HostIp:"127.0.0.1",HostPort:"37890"} and
            .[0].NetworkSettings.Ports["37891/tcp"][0] == {HostIp:"127.0.0.1",HostPort:"37891"} and
            .[0].NetworkSettings.Ports["37891/udp"][0] == {HostIp:"127.0.0.1",HostPort:"37891"}
          ' >/dev/null
          sudo docker inspect "$feed_id" | jq -e '
            .[0].NetworkSettings.Ports["8080/tcp"][0] == {HostIp:"127.0.0.1",HostPort:"38780"} and
            (.[0].NetworkSettings.Networks | has("server-edge-proxy-hub_host_publish"))
          ' >/dev/null

          for _ in {1..20}; do
            if curl -fsS --max-time 1 http://127.0.0.1:38780/ | grep -q '^Feed OK$'; then
              exit 0
            fi
            sleep 1
          done
          echo 'ERROR: Feed host publishing is not reachable' >&2
          exit 1
